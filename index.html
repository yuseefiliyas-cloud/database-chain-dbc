  <script>
    // 1. PASTE YOUR 4 REAL SEPOLIA CONTRACT ADDRESSES HERE:
    const DBC_ADDR   = "0xaD71CcC7947c4Fc7d9CFB374905d23392e97c27B";
    const MUSDC_ADDR = "0x6eFb3c7900aDe0483A5e2286D4B3234c85E699dd";
    const DEX_ADDR   = "0x9522AC3162a6182CA679Cb96F8f7AE10026e75c8";
    const VAULT_ADDR = "0xBE0C044298CD1a0AfF6Ebf6ff3E4CF53EbE1f981";

    let userAddr = null;

    function setStatus(msg) {
      document.getElementById("status").innerText = msg;
    }

    // FIXED: Properly reads whole part (parts[0]) and decimal part (parts[1])
    function toHex18(amountStr) {
      const clean = amountStr.trim();
      const parts = clean.split(".");
      const wholePart = parts[0] ? BigInt(parts[0]) : 0n;
      const fracStr = parts[1] ? (parts[1] + "000000000000000000").slice(0, 18) : "0";
      const fracPart = BigInt(fracStr);
      const totalWei = (wholePart * (10n ** 18n)) + fracPart;
      return totalWei.toString(16).padStart(64, "0");
    }

    function padAddr(addr) {
      return addr.toLowerCase().replace("0x", "").padStart(64, "0");
    }

    async function sendTx(to, data) {
      const txHash = await window.ethereum.request({
        method: "eth_sendTransaction",
        params: [{ from: userAddr, to: to, data: data }]
      });
      setStatus("Transaction sent! Hash: " + txHash + " (Waiting for Sepolia block...)");
      for (let i = 0; i < 60; i++) {
        await new Promise(r => setTimeout(r, 1500));
        const receipt = await window.ethereum.request({
          method: "eth_getTransactionReceipt",
          params: [txHash]
        });
        if (receipt) {
          if (receipt.status === "0x0") {
            throw new Error("Transaction reverted on-chain (check liquidity or balance).");
          }
          return receipt;
        }
      }
      throw new Error("Timed out waiting for block confirmation.");
    }

    async function connectWallet() {
      try {
        if (!window.ethereum) {
          return setStatus("MetaMask not found! Open this link in Chrome/Brave with MetaMask installed.");
        }
        setStatus("Opening MetaMask...");
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        userAddr = accounts[0];

        try {
          await window.ethereum.request({
            method: "wallet_switchEthereumChain",
            params: [{ chainId: "0xaa36a7" }]
          });
        } catch (e) {
          setStatus("Connected, please ensure MetaMask is on the Sepolia network.");
        }

        document.getElementById("walletAddress").innerText = userAddr.slice(0, 6) + "..." + userAddr.slice(-4);
        document.getElementById("connectBtn").innerText = "Connected";
        setStatus("Connected to Sepolia! Wallet: " + userAddr);
      } catch (err) {
        setStatus("Connection rejected: " + (err.message || err));
      }
    }

    async function approveToken(tokenAddr, spenderAddr, hexAmount) {
      // approve(address,uint256) -> 0x095ea7b3
      const data = "0x095ea7b3" + padAddr(spenderAddr) + hexAmount;
      await sendTx(tokenAddr, data);
    }

    async function buyDBC() {
      try {
        if (!userAddr) return setStatus("Click Connect MetaMask first!");
        const val = document.getElementById("swapAmount").value;
        if (!val || Number(val) <= 0) return setStatus("Enter an amount greater than 0.");
        const hexAmt = toHex18(val);
        const minOut = (1n).toString(16).padStart(64, "0");

        setStatus("Step 1/2: Approve mUSDC in MetaMask...");
        await approveToken(MUSDC_ADDR, DEX_ADDR, hexAmt);

        setStatus("Step 2/2: Confirm Buy $DBC (0.00% fee) in MetaMask...");
        // VERIFIED Keccak-256 selector for buyDBC(uint256,uint256) -> 0x35c908dd
        await sendTx(DEX_ADDR, "0x35c908dd" + hexAmt + minOut);
        setStatus("Success! Bought $DBC with 0.00% fee.");
      } catch (err) {
        setStatus("Buy failed: " + (err.message || err));
      }
    }

    async function sellDBC() {
      try {
        if (!userAddr) return setStatus("Click Connect MetaMask first!");
        const val = document.getElementById("swapAmount").value;
        if (!val || Number(val) <= 0) return setStatus("Enter an amount greater than 0.");
        const hexAmt = toHex18(val);
        const minOut = (1n).toString(16).padStart(64, "0");

        setStatus("Step 1/2: Approve $DBC in MetaMask...");
        await approveToken(DBC_ADDR, DEX_ADDR, hexAmt);

        setStatus("Step 2/2: Confirm Sell $DBC (0.10% fee in mUSDC) in MetaMask...");
        // VERIFIED Keccak-256 selector for sellDBC(uint256,uint256) -> 0xa8b7a6b2
        await sendTx(DEX_ADDR, "0xa8b7a6b2" + hexAmt + minOut);
        setStatus("Success! Sold $DBC and routed mUSDC yield to Staking Vault.");
      } catch (err) {
        setStatus("Sell failed: " + (err.message || err));
      }
    }

    async function stakeDBC() {
      try {
        if (!userAddr) return setStatus("Click Connect MetaMask first!");
        const val = document.getElementById("stakeAmount").value;
        if (!val || Number(val) <= 0) return setStatus("Enter a stake amount greater than 0.");
        const hexAmt = toHex18(val);

        setStatus("Step 1/2: Approve $DBC for Staking Vault...");
        await approveToken(DBC_ADDR, VAULT_ADDR, hexAmt);

        setStatus("Step 2/2: Confirm Stake $DBC in MetaMask...");
        // VERIFIED Keccak-256 selector for stake(uint256) -> 0xa694fc3a
        await sendTx(VAULT_ADDR, "0xa694fc3a" + hexAmt);
        setStatus("Success! $DBC staked in Vault.");
      } catch (err) {
        setStatus("Stake failed: " + (err.message || err));
      }
    }

    async function checkRewards() {
      try {
        if (!userAddr) return setStatus("Click Connect MetaMask first!");
        // VERIFIED Keccak-256 selector for pendingRewards(address) -> 0x31d7a262
        const res = await window.ethereum.request({
          method: "eth_call",
          params: [{ to: VAULT_ADDR, data: "0x31d7a262" + padAddr(userAddr) }, "latest"]
        });
        const wei = BigInt(res);
        const whole = wei / (10n ** 18n);
        const frac = (wei % (10n ** 18n)).toString().padStart(18, "0").slice(0, 6);
        setStatus("Pending mUSDC Yield: " + whole + "." + frac + " mUSDC");
      } catch (err) {
        setStatus("Check failed: " + (err.message || err));
      }
    }

    async function claimYield() {
      try {
        if (!userAddr) return setStatus("Click Connect MetaMask first!");
        setStatus("Confirm Claim mUSDC in MetaMask...");
        // VERIFIED Keccak-256 selector for claimRewards() -> 0x372500ab
        await sendTx(VAULT_ADDR, "0x372500ab");
        setStatus("Success! mUSDC yield claimed to your wallet.");
      } catch (err) {
        setStatus("Claim failed: " + (err.message || err));
      }
    }
  </script>
