<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Database Chain ($DBC) — Testnet DeFi Portal</title>
  <script src="https://cloudflare.com"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b0f19; color: #f8fafc; max-width: 720px; margin: 40px auto; padding: 0 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
    h1, h2 { margin-top: 0; color: #38bdf8; }
    input { width: 100%; padding: 10px; margin: 8px 0 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { background: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-right: 8px; }
    button:hover { background: #0369a1; }
    .badge { background: #064e3b; color: #34d399; padding: 4px 10px; border-radius: 999px; font-size: 12px; }
    #status { margin-top: 10px; color: #fbbf24; font-size: 14px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Database Chain ($DBC) <span class="badge">Sepolia Testnet</span></h1>
  <div class="card">
    <button onclick="connectWallet()">Connect MetaMask</button>
    <span id="walletAddress">Not connected</span>
    <div id="status"></div>
  </div>

  <div class="card">
    <h2>SimpleDEX (0.00% Buy | 0.10% Sell in mUSDC)</h2>
    <input type="number" id="swapAmount" placeholder="Amount (e.g. 100)" />
    <button onclick="buyDBC()">Buy $DBC (0% Fee)</button>
    <button onclick="sellDBC()">Sell $DBC (0.10% Fee)</button>
  </div>

  <div class="card">
    <h2>Staking Vault (Earn Real mUSDC Yield)</h2>
    <input type="number" id="stakeAmount" placeholder="Amount of $DBC to stake" />
    <button onclick="stakeDBC()">Stake $DBC</button>
    <button onclick="claimYield()">Claim mUSDC Rewards</button>
    <button onclick="checkRewards()">Check Pending Yield</button>
  </div>

  <script>
    // PASTE YOUR SEPOLIA CONTRACT ADDRESSES HERE:
    const DBC_ADDR = "0xeD50B57b4f930d6110B2689473CBF8d77163daEE";
    const MUSDC_ADDR = "0x22cfdf5b6b0331003B66AaE6B818e02E10FcD327";
    const DEX_ADDR = "0xb6F4b6c71B32316DB4Fd338b500cf89D52DE5709";
    const VAULT_ADDR = "0xB7c2221A7BAf015c424fc70C5F8896C30DABa50f";

    const ERC20_ABI = ["function approve(address spender, uint256 amount) external returns (bool)"];
    const DEX_ABI = [
      "function buyDBC(uint256 quoteAmountIn, uint256 minDbcOut) external returns (uint256)",
      "function sellDBC(uint256 dbcAmountIn, uint256 minQuoteOut) external returns (uint256)"
    ];
    const VAULT_ABI = [
      "function stake(uint256 amount) external",
      "function claimRewards() external",
      "function pendingRewards(address user) external view returns (uint256)"
    ];

    let provider, signer, userAddr;

    async function connectWallet() {
      if (!window.ethereum) return alert("Please install MetaMask!");
      provider = new ethers.BrowserProvider(window.ethereum);
      signer = await provider.getSigner();
      userAddr = await signer.getAddress();
      document.getElementById("walletAddress").innerText = userAddr;
      setStatus("Wallet connected on Sepolia!");
    }

    function setStatus(msg) { document.getElementById("status").innerText = msg; }

    async function buyDBC() {
      const amt = ethers.parseUnits(document.getElementById("swapAmount").value, 18);
      const musdc = new ethers.Contract(MUSDC_ADDR, ERC20_ABI, signer);
      const dex = new ethers.Contract(DEX_ADDR, DEX_ABI, signer);
      setStatus("Approving mUSDC...");
      await (await musdc.approve(DEX_ADDR, amt)).wait();
      setStatus("Buying $DBC (0.00% fee)...");
      await (await dex.buyDBC(amt, 1)).wait();
      setStatus("Success! Bought $DBC with 0% fee.");
    }

    async function sellDBC() {
      const amt = ethers.parseUnits(document.getElementById("swapAmount").value, 18);
      const dbc = new ethers.Contract(DBC_ADDR, ERC20_ABI, signer);
      const dex = new ethers.Contract(DEX_ADDR, DEX_ABI, signer);
      setStatus("Approving $DBC...");
      await (await dbc.approve(DEX_ADDR, amt)).wait();
      setStatus("Selling $DBC (0.10% mUSDC fee routed to stakers)...");
      await (await dex.sellDBC(amt, 1)).wait();
      setStatus("Success! Sold $DBC and funded Staking Vault.");
    }

    async function stakeDBC() {
      const amt = ethers.parseUnits(document.getElementById("stakeAmount").value, 18);
      const dbc = new ethers.Contract(DBC_ADDR, ERC20_ABI, signer);
      const vault = new ethers.Contract(VAULT_ADDR, VAULT_ABI, signer);
      setStatus("Approving $DBC for Staking Vault...");
      await (await dbc.approve(VAULT_ADDR, amt)).wait();
      setStatus("Staking $DBC...");
      await (await vault.stake(amt)).wait();
      setStatus("Success! $DBC staked.");
    }

    async function checkRewards() {
      const vault = new ethers.Contract(VAULT_ADDR, VAULT_ABI, signer);
      const pending = await vault.pendingRewards(userAddr);
      setStatus("Pending mUSDC Yield: " + ethers.formatUnits(pending, 18) + " mUSDC");
    }

    async function claimYield() {
      const vault = new ethers.Contract(VAULT_ADDR, VAULT_ABI, signer);
      setStatus("Claiming mUSDC rewards...");
      await (await vault.claimRewards()).wait();
      setStatus("Success! mUSDC yield claimed to your wallet.");
    }
  </script>
</body>
</html>
